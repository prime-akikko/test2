[package]
name = "starter_app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "GPUI desktop starter shell (Windows-primary) — pure GUI, no protocol"
publish = false
default-run = "starter_app"

[lib]
name = "starter_app"
path = "src/lib.rs"

[[bin]]
name = "starter_app"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["mock"]
# Demo copy for headless Cloud/CI smoke (no network).
mock = ["dep:starter_mock"]
# Enable the GPUI dependency. Default is off so Linux/Cloud `cargo check`
# stays green without Wayland/X11/Vulkan; Windows GUI builds pass `--features gui`.
gui = ["dep:gpui"]

[dependencies]
starter_core = { workspace = true }
starter_mock = { workspace = true, optional = true }
# Pin decision: crates.io `gpui` 0.2.2 (see README.md).
gpui = { workspace = true, optional = true }
